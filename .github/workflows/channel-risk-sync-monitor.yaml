name: channel-risk-sync-monitor

on:
  workflow_call:
    inputs:
      git-ref:
        default: '${{ github.ref }}'
        description: The branch to checkout.
        required: false
        type: string
      issue-assignee:
        default: ''
        description: The issue assignee in the form '@name'.
        required: false
        type: string
      snap-name:
        default: ""
        description: The snap name.
        required: false
        type: string
      snap-risk-aspirant:
        default: candidate
        description: Snap Store channel risk used as aspirant.
        required: false
        type: string
      snap-risk-target:
        default: stable
        description: Snap Store channel risk used as reference.
        required: false
        type: string
      snap-track:
        default: latest
        description: Snap Store channel track to monitor.
        required: false
        type: string
      snapcraft-source-subdir:
        default: "."
        description: The directory of the Snapcraft project.
        required: false
        type: string
      threshold:
        default: 10
        description: The threshold to trigger the issue (in days).
        required: false
        type: number

permissions:
  contents: read

concurrency:
  group: channel-risk-monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      issues: write
    steps:

      - name: Checkout
        if: "${{ inputs.snap-name == '' }}"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: '${{ inputs.git-ref }}'

      - name: Parse snapcraft metadata
        if: "${{ inputs.snap-name == '' }}"
        id: parse-metadata
        uses: canonical/robotics-actions-workflows/parse-snapcraft-metadata@main
        with:
          snapcraft-source-subdir: ${{ inputs.snapcraft-source-subdir }}

      - name: Resolve snap name
        id: snap
        env:
          SNAP_INPUT: '${{ inputs.snap-name }}'
          SNAP_FROM_YAML: '${{ steps.parse-metadata.outputs.snap-name }}'
        run: |
          snap_name="${SNAP_INPUT:-${SNAP_FROM_YAML}}"
          if [ -z "${snap_name}" ]; then
            echo "Error: snap name could not be determined"
            exit 1
          fi
          echo "name=${snap_name}" >> "$GITHUB_OUTPUT"

      - name: Compare the snap revisions
        id: revision
        env:
          SNAP_ASPIRANT_CHANNEL: "${{ inputs.snap-track }}/${{ inputs.snap-risk-aspirant }}"
          SNAP_TARGET_CHANNEL: "${{ inputs.snap-track }}/${{ inputs.snap-risk-target }}"
          SNAP_NAME: "${{ steps.snap.outputs.name }}"
        run: |
          target_rev=$(snap info "${SNAP_NAME}" | yq '.channels[env(SNAP_TARGET_CHANNEL)]' | awk '{gsub(/[()]/, ""); print $3}')
          aspirant_rev=$(snap info "${SNAP_NAME}" | yq '.channels[env(SNAP_ASPIRANT_CHANNEL)]' | awk '{gsub(/[()]/, ""); print $3}')

          if (( aspirant_rev > target_rev )); then
            echo "The revision on channel '${SNAP_ASPIRANT_CHANNEL}'"\
            "is newer than on channel '${SNAP_TARGET_CHANNEL}'"\
            "(${aspirant_rev} > ${target_rev})."
            echo "is-newer=1" >> "$GITHUB_OUTPUT"
          else
            echo "is-newer=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the revision publication date on the aspirant snap track
        if: steps.revision.outputs.is-newer == '1'
        id: date
        env:
          SNAP_ASPIRANT_CHANNEL: "${{ inputs.snap-track }}/${{ inputs.snap-risk-aspirant }}"
          SNAP_NAME: "${{ steps.snap.outputs.name }}"
        run: |
          PUB_DATE="$(snap info "${SNAP_NAME}" | yq '.channels[env(SNAP_ASPIRANT_CHANNEL)]' | awk '{print $2}')"

          DATE_REGEX="^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"

          # @todo(artivis) handle '^' which means that the risk follows the one above
          if ! [[ ${PUB_DATE} =~ ${DATE_REGEX} ]]; then
            echo "The date '${PUB_DATE}' on channel '${SNAP_ASPIRANT_CHANNEL}' does not match the expect format 'YYYY-MM-DD'."
            exit 1
          fi

          echo "Channel '${SNAP_ASPIRANT_CHANNEL}' publication date: ${PUB_DATE}"

          echo "snap-aspirant-pub-date=${PUB_DATE}" >> "$GITHUB_OUTPUT"

      - name: Compare aspirant publication date to threshold
        if: steps.revision.outputs.is-newer == '1'
        id: compare
        env:
          PUB_DATE: ${{ steps.date.outputs.snap-aspirant-pub-date }}
          THRESHOLD: ${{ inputs.threshold }}
          SNAP_ASPIRANT_CHANNEL: "${{ inputs.snap-track }}/${{ inputs.snap-risk-aspirant }}"
        run: |

          # Convert the dates to seconds since epoch
          SNAP_ASPIRANT_PUB_DATE_SECONDS=$(date -d "${PUB_DATE}" +%s)
          TODAY_SECONDS=$(date +%s)

          # Calculate the difference in days
          DIFF_SECS=$((TODAY_SECONDS - SNAP_ASPIRANT_PUB_DATE_SECONDS))
          DIFF_DAYS=$((DIFF_SECS / 86400))

          # Compare the difference in days to the threshold
          if (( DIFF_DAYS >= THRESHOLD )); then
            echo "The revision published on '${SNAP_ASPIRANT_CHANNEL}'"\
            "is waiting for promotion"\
            "(${DIFF_DAYS} > ${THRESHOLD})."
            echo "is-outdated=1" >> "$GITHUB_OUTPUT"
          else
            echo "is-outdated=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue
        if: steps.compare.outputs.is-outdated == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAP_TARGET_CHANNEL: "${{ inputs.snap-track }}/${{ inputs.snap-risk-target }}"
          SNAP_ASPIRANT_CHANNEL: "${{ inputs.snap-track }}/${{ inputs.snap-risk-aspirant }}"
          ISSUE_ASSIGNEE: ${{ inputs.issue-assignee }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          THRESHOLD: ${{ inputs.threshold }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          search_issue="$(gh issue --repo "${REPO}" list --state open \
            --search "${SNAP_ASPIRANT_CHANNEL} in:title" --json number)"

          if [[ ! "${search_issue}" =~ "number" ]]; then

            echo "Creating a new issue."

            extra_args=()
            if [ -n "${ISSUE_ASSIGNEE}" ]; then
              extra_args+=(--assignee "${ISSUE_ASSIGNEE}")
            fi

            echo -e "## Monitoring report\n\n" \
            "- Author: @${TRIGGERING_ACTOR}\n" \
            "- Target channel: '${SNAP_TARGET_CHANNEL}'\n" \
            "- Aspirant channel: '${SNAP_ASPIRANT_CHANNEL}'\n" \
            "- Workflow Path: '${WORKFLOW_REF}'\n\n" \
            "The snap revision on channel '${SNAP_ASPIRANT_CHANNEL}' has been pending for more than ${THRESHOLD} days'.\n" \
            "Please consider promoting '${SNAP_ASPIRANT_CHANNEL}' to '${SNAP_TARGET_CHANNEL}'.\n\n" \
            "Workflow details at: https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            | \
            gh issue --repo "${REPO}" create \
              --title "[CI] Consider promoting '${SNAP_ASPIRANT_CHANNEL}' to '${SNAP_TARGET_CHANNEL}'." \
              "${extra_args[@]}" \
              --body-file -
          else
            echo "Issue already opened."
          fi
