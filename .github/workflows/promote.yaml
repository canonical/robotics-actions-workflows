name: Promote snaps

on:
  workflow_call:
    inputs:
      snap:
        default: ''
        description: The snap to promote. If not provided, the name is inferred from the snapcraft.yaml.
        required: false
        type: string
      from-channel:
        default: 'latest/candidate'
        description: The channel from which to promote.
        required: false
        type: string
      to-channel:
        default: 'latest/stable'
        description: The channel to which to promote.
        required: false
        type: string
      snapcraft-source-subdir:
        default: '.'
        description: The directory of the snapcraft project. Used to infer the snap name when the snap input is not provided.
        required: false
        type: string
      git-ref:
        default: '${{ github.ref }}'
        description: The branch to checkout. Used to infer the snap name when the snap input is not provided.
        required: false
        type: string
    secrets:
      snapstore-login:
        description: Snap Store credential (see 'snapcraft export-login').
        required: true

permissions:
  contents: read

concurrency:
  group: promote-${{ github.workflow }}-${{ inputs.snap }}-${{ inputs.to-channel }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.snapstore-login }}
    steps:

      - name: Check Snapstore login
        run: |
          # Check if the key is empty
          if [ -z "${SNAPCRAFT_STORE_CREDENTIALS}" ]; then
            echo "Snapstore login is empty !"
            exit 1
          fi

      - name: Checkout
        if: inputs.snap == ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: '${{ inputs.git-ref }}'

      - name: Parse snapcraft metadata
        if: inputs.snap == ''
        id: parse-metadata
        uses: canonical/robotics-actions-workflows/parse-snapcraft-metadata@main
        with:
          snapcraft-source-subdir: ${{ inputs.snapcraft-source-subdir }}

      - name: Resolve snap name
        id: resolve-snap
        env:
          SNAP_INPUT: '${{ inputs.snap }}'
          SNAP_FROM_YAML: '${{ steps.parse-metadata.outputs.snap-name }}'
        run: |
          snap_name="${SNAP_INPUT:-${SNAP_FROM_YAML}}"
          if [ -z "${snap_name}" ]; then
            echo "Error: no snap name provided and none found in snapcraft.yaml"
            exit 1
          fi
          echo "snap-name=${snap_name}" >> "$GITHUB_OUTPUT"

      - name: Setup Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Promote snap
        env:
          SNAP: '${{ steps.resolve-snap.outputs.snap-name }}'
          FROM_CHANNEL: '${{ inputs.from-channel }}'
          TO_CHANNEL: '${{ inputs.to-channel }}'
        run: snapcraft promote "${SNAP}" --from-channel "${FROM_CHANNEL}" --to-channel "${TO_CHANNEL}" --yes

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        name: Upload Snapcraft promote logs
        if: always()
        with:
          name: snapcraft_logs_${{ steps.resolve-snap.outputs.snap-name }}
          path: /home/runner/.local/state/snapcraft/log/
