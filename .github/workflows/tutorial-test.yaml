name: tutorial-test

on:
  workflow_call:
    inputs:
      tutorial-path:
        description: Path to the tutorial, relative to the caller repository.
        required: true
        type: string
      skill-path:
        description: Path to the tutorial's SKILL.md, relative to the caller repository.
        required: true
        type: string
      runs-on:
        default: ubuntu-latest
        description: The Ubuntu runner image to test on.
        required: false
        type: string
      model:
        default: openrouter/moonshotai/kimi-k3
        description: Model used to drive the tutorial tester, in provider/model form.
        required: false
        type: string
      git-ref:
        default: ${{ github.ref }}
        description: The caller repository ref to test.
        required: false
        type: string
      timeout-minutes:
        default: 60
        description: Maximum duration of the tutorial-test job.
        required: false
        type: number
      issue-labels:
        default: tutorial-test
        description: Comma-separated labels to apply to created issues.
        required: false
        type: string
    outputs:
      result:
        description: The final tutorial-test result (pass, warn, or fail).
        value: ${{ jobs.tutorial-test.outputs.result }}
      issue-url:
        description: The URL of the issue created for a warn or fail result.
        value: ${{ jobs.tutorial-test.outputs.issue-url }}
    secrets:
      openrouter-api-key:
        description: OpenRouter API key used by the AI tutorial tester.
        required: true

concurrency:
  group: tutorial-test-${{ github.workflow }}-${{ github.ref }}-${{ inputs.tutorial-path }}
  cancel-in-progress: false

jobs:
  tutorial-test:
    name: Test tutorial
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      issues: write
    outputs:
      result: ${{ steps.test.outputs.result }}
      issue-url: ${{ steps.test.outputs.issue-url }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git-ref }}
          persist-credentials: false

      # LXD setup is provided here for tutorials that need it. Callers that
      # require a different environment should call the composite action
      # directly and run their own setup steps before it.
      - name: Set up LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: latest/stable

      - name: Test tutorial
        id: test
        # todo: use @main when merged.
        uses: canonical/robotics-actions-workflows/tutorial-test@feat/tutorial-test-with-ai
        with:
          tutorial-path: ${{ inputs.tutorial-path }}
          skill-path: ${{ inputs.skill-path }}
          model: ${{ inputs.model }}
          issue-labels: ${{ inputs.issue-labels }}
          openrouter-api-key: ${{ secrets.openrouter-api-key }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
