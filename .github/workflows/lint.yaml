name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  actionlint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run actionlint
        uses: reviewdog/action-actionlint@fffd1c83f49769ba2fd3170d7df8c2cc36d7afd7 # v1.69
        with:
          fail_level: error
          reporter: github-check
