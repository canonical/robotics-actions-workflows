name: test

on:
  workflow_call:
    inputs:
      lxd-image:
        default: ''
        description: The LXD image to run the snap tests in.
        required: false
        type: string
      runs-on:
        default: 'ubuntu-latest'
        description: The runner(s) to use.
        required: false
        type: string
      git-ref:
        default: '${{ github.ref }}'
        description: The branch used to build the snap.
        required: false
        type: string
      snap-install-args:
        default: "--dangerous"
        description: The argument to pass to snap install.
        required: false
        type: string
      snap-test-script:
        default: ''
        description: A test script to run against the snap.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-test-runners:
    runs-on: ubuntu-latest
    outputs:
      runs-on: ${{ steps.string-to-json.outputs.json }}
    steps:
      - name: String to JSON list
        id: string-to-json
        uses: ./string-to-json
        with:
          string: ${{ inputs.runs-on }}

  test:
    needs: [prepare-test-runners]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: ${{ fromJSON(needs.prepare-test-runners.outputs.runs-on) }}
    steps:

      - name: Find out the arch
        id: get-arch
        run: |
          echo "arch=$(dpkg --print-architecture)" >> "$GITHUB_OUTPUT"

      - name: Find out the branch name
        id: get-branch
        env:
          GIT_REF: '${{ inputs.git-ref }}'
        run: |
          echo "branch_name=${GIT_REF//[\/-]/_}" >> "$GITHUB_OUTPUT"

      - name: Download snap artifact(s)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: .
          pattern: 'workflow-build-snap-*${{ steps.get-arch.outputs.arch }}*-${{ steps.get-branch.outputs.branch_name }}'

      - name: Retrieve snap file
        id: get-snap-file
        run: |
          files=$(find . -name '*.snap' -printf '%h/%f ')
          echo "Files: ${files}"
          echo "snap-files=${files}" >> "$GITHUB_OUTPUT"

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        if: "${{ inputs.lxd-image != '' }}"

      - name: Launch an LXD container
        env:
          LXD_IMAGE: '${{ inputs.lxd-image }}'
        run: |
          lxc launch "${LXD_IMAGE}" lxc-container
          lxc exec lxc-container -- cloud-init status --wait
          until lxc exec lxc-container -- getent passwd ubuntu; do
            echo "Waiting for the ubuntu user."
            sleep 0.25
          done
        if: "${{ inputs.lxd-image != '' }}"

      - name: Install snapd
        run: |
          echo "Installing snapd from latest/stable channel"
          # Install snapd as a snap if not already installed
          if ! snap list snapd &> /dev/null; then
            sudo snap install snapd
          fi
          sudo snap refresh snapd --channel=latest/stable
        if: "${{ inputs.lxd-image == '' }}"

      - name: Install snapd in the container
        run: |
          echo "Installing snapd from latest/stable channel in container"
          # Install snapd as a snap if not already installed
          if ! lxc exec lxc-container -- sh -c "snap list snapd" &> /dev/null; then
            lxc exec lxc-container -- sh -c "snap install snapd"
          fi
          lxc exec lxc-container -- sh -c "snap refresh snapd --channel=latest/stable"
        if: "${{ inputs.lxd-image != '' }}"

      - name: Push the snap to the container
        env:
          SNAP_FILES: '${{ steps.get-snap-file.outputs.snap-files }}'
        run: |
          for snap in ${SNAP_FILES}; do
            lxc file push "${snap}" lxc-container/home/ubuntu/
          done
        if: "${{ inputs.lxd-image != '' }}"

      - name: Install the snap
        env:
          SNAPCRAFT_INSTALL_ARGS : '${{ inputs.snap-install-args }}'
          SNAP_FILES: '${{ steps.get-snap-file.outputs.snap-files }}'
        run: |
          read -ra install_args <<< "${SNAPCRAFT_INSTALL_ARGS}"
          for snap in ${SNAP_FILES}; do
            sudo snap install "${snap}" "${install_args[@]}"
          done
        if: "${{ inputs.lxd-image == '' }}"

      - name: Install the snap in the container
        env:
          SNAPCRAFT_INSTALL_ARGS : '${{ inputs.snap-install-args }}'
          SNAP_FILES: '${{ steps.get-snap-file.outputs.snap-files }}'
        run: |
          read -ra install_args <<< "${SNAPCRAFT_INSTALL_ARGS}"
          for snap in ${SNAP_FILES}; do
            snap_basename="$(basename "${snap}")"
            echo "Installing snap '/home/ubuntu/${snap_basename}'"
            lxc exec lxc-container -- snap install "/home/ubuntu/${snap_basename}" "${install_args[@]}"
          done
        if: "${{ inputs.lxd-image != '' }}"

      - name: Retrieve snap name
        id: get-snap-name
        env:
          SNAP_FILES: '${{ steps.get-snap-file.outputs.snap-files }}'
        run: |
          snap_names=()
          for snap in ${SNAP_FILES}; do
            snap_names+=("$(basename -s .snap "${snap}" | sed 's/_.*//')")
          done
          echo "snap-names=${snap_names[*]}" >> "$GITHUB_OUTPUT"

      - name: Snap info
        if: "${{ inputs.lxd-image == '' }}"
        env:
          SNAP_NAMES: '${{ steps.get-snap-name.outputs.snap-names }}'
        run: |
          for snap in ${SNAP_NAMES}; do
            snap info "${snap}"
          done

      - name: Snap info
        if: "${{ inputs.lxd-image != '' }}"
        env:
          SNAP_NAMES: '${{ steps.get-snap-name.outputs.snap-names }}'
        run: |
          for snap in ${SNAP_NAMES}; do
            lxc exec lxc-container -- snap info "${snap}"
          done

      - name: Create test script
        if: inputs.snap-test-script != ''
        shell: bash
        run: |
          cat > test-script.sh << 'WORKFLOW_SNAP_TEST_SCRIPT_EOF'
            ${{ inputs.snap-test-script }}
          WORKFLOW_SNAP_TEST_SCRIPT_EOF

      - name: Push test script LXD container
        run: lxc file push test-script.sh lxc-container/home/ubuntu/
        if: "${{ inputs.lxd-image != '' && inputs.snap-test-script != '' }}"

      - name: Execute test script
        shell: bash
        run: bash -euxo pipefail test-script.sh
        if: "${{ inputs.lxd-image == '' && inputs.snap-test-script != '' }}"

      - name: Execute test script in the container
        shell: bash
        run: lxc exec --user 1000 lxc-container -- sh -c "bash -euxo pipefail /home/ubuntu/test-script.sh"
        if: "${{ inputs.lxd-image != '' && inputs.snap-test-script != '' }}"
