name: build

on:
  workflow_call:
    inputs:
      git-ref:
        default: '${{ github.ref }}'
        description: The branch to checkout.
        required: false
        type: string
      runs-on:
        default: 'ubuntu-latest'
        description: The runner(s) to use.
        required: false
        type: string
      snapcraft-channel:
        default: 'latest/stable'
        description: The channel from which to install Snapcraft.
        required: false
        type: string
      snapcraft-enable-experimental-extensions:
        default: false
        description: Whether to enable Snapcraft experimental extensions or not.
        required: false
        type: boolean
      snapcraft-source-subdir:
        default: '.'
        description: The path where to execute snapcraft.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-build-runners:
    runs-on: ubuntu-latest
    outputs:
      runs-on: ${{ steps.string-to-json.outputs.json }}
    steps:
      - name: String to JSON list
        id: string-to-json
        uses: canonical/robotics-actions-workflows/string-to-json@main
        with:
          string: ${{ inputs.runs-on }}

  prepare-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.string-to-json.outputs.json }}
    steps:
      - name: String to JSON list
        id: string-to-json
        uses: canonical/robotics-actions-workflows/string-to-json@main
        with:
          string: ${{ inputs.snapcraft-source-subdir }}

  build:
    needs: [prepare-build-runners, prepare-build-matrix]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        source-subdir: ${{ fromJson(needs.prepare-build-matrix.outputs.matrix) }}
        runs-on: ${{ fromJSON(needs.prepare-build-runners.outputs.runs-on) }}
    steps:

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: '${{ inputs.git-ref }}'

      - name: Build snap
        uses: canonical/craft-actions/snapcraft/pack@acd2f2e61c7563b38ba89390ca0e910fa7d2784f # v0.1.1
        id: build-snap
        env:
          SNAPCRAFT_BUILD_INFO: 1
          SNAPCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: '${{ inputs.snapcraft-enable-experimental-extensions }}'
        with:
          path: '${{ matrix.source-subdir }}'
          channel: '${{ inputs.snapcraft-channel }}'

      - name: Find out the branch name
        id: get-branch
        env:
          GIT_REF: '${{ inputs.git-ref }}'
        run: |
          echo "branch_name=${GIT_REF//[\/-]/_}" >> "$GITHUB_OUTPUT"

      - name: Set unique artifact name
        id: artifact-unique-name
        env:
          SNAP_PATH: '${{ steps.build-snap.outputs.snap }}'
          BRANCH_NAME: '${{ steps.get-branch.outputs.branch_name }}'
        run: |
          echo "artifact-name=workflow-build-snap-$(basename -s .snap "${SNAP_PATH}")-${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload snap artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: '${{ steps.artifact-unique-name.outputs.artifact-name }}'
          path: '${{ steps.build-snap.outputs.snap }}'
          retention-days: 10
          if-no-files-found: error

      - name: Build summary
        env:
          SNAP_PATH: '${{ steps.build-snap.outputs.snap }}'
          ARTIFACT_NAME: '${{ steps.artifact-unique-name.outputs.artifact-name }}'
          RUNS_ON: '${{ matrix.runs-on }}'
          SOURCE_SUBDIR: '${{ matrix.source-subdir }}'
        run: |
          {
            echo "### 📦 Snap built"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Snap file | \`$(basename "${SNAP_PATH}")\` |"
            echo "| Artifact | \`${ARTIFACT_NAME}\` |"
            echo "| Runner | \`${RUNS_ON}\` |"
            echo "| Source subdir | \`${SOURCE_SUBDIR}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
